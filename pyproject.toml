[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "butterfly-ai-local"
version = "0.0.3"
description = "ButterflyAI experimental local Transformer, epistemic engine and continual-learning system"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "transformers>=4.51.0",
    "accelerate>=1.2",
    "safetensors>=0.4",
    "huggingface_hub>=0.27",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[tool.setuptools.packages.find]
include = ["butterfly*"]
