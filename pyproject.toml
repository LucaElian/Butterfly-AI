[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "butterfly-ai-local"
dynamic = ["version"]
description = "ButterflyAI experimental local Transformer, epistemic engine and continual-learning system"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "safetensors>=0.4",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[tool.setuptools.packages.find]
include = ["butterfly*"]

[tool.setuptools_scm]
